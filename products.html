<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Products | Woolworths</title>
  <meta name="description" content="Explore our catalog of premium fashion, organic food, and modern home essentials.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">WOOLWORTHS</a>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="products.html" class="active">Products</a></li>
          <li><a href="enquiry.html">Service Enquiry</a></li>
          <li><a href="contact.html">Contact Us</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Our Product Collection</h1>

    <div class="controls-bar">
      <input type="text" id="searchInput" placeholder="Search products by name...">
      <select id="categoryFilter">
        <option value="all">All Categories</option>
        <option value="Food">Food & Organic</option>
        <option value="Fashion">Fashion & Apparel</option>
        <option value="Home">Home Essentials</option>
      </select>
      <select id="sortSelect">
        <option value="default">Sort By</option>
        <option value="price-low">Price: Low to High</option>
        <option value="price-high">Price: High to Low</option>
      </select>
    </div>

    <div id="productGrid" class="product-grid">
      <!-- Dynamically Populated by dynamic.js -->
    </div>
  </main>

  <!-- Lightbox Modal -->
  <div id="lightbox" class="lightbox">
    <img id="lightboxImg" class="lightbox-content" src="" alt="Expanded View">
  </div>

  <footer>
    <p>&copy; 2026 Woolworths Educational Prototype.</p>
  </footer>

  <script src="js/dynamic.js"></script>
</body>
</html>
